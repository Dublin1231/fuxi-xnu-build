name: fuxi PAS diagnostic kernel
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          path: build-config
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bangprovn/ios-fuxi
          ref: 068faa44bcebb6b8a2292b6113a94ddb85214810
          path: upstream
          persist-credentials: false
      - name: Stage the reviewed logging-only patch
        run: python3 build-config/diagnostics/fuxi-pas-20261027-01/stage-pas-diagnostics.py upstream --stage
      - name: Build diagnostic kernel
        working-directory: upstream
        run: bash tools/ci/build.sh kernel-metal4
      - name: Upload kernel and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-pas-diagnostic-kernel
          path: upstream/tools/out/ci/kernel-metal4/
          if-no-files-found: error
          retention-days: 7
