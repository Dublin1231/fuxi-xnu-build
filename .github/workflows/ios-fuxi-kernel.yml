name: ios-fuxi kernel build

# Build the pinned bangprovn/ios-fuxi xnu-8796 kernel on GitHub's macOS runner.
#
# Why here: the baseline-switch decision (verification/ios-fuxi-baseline-merge/
# 20261025-01) moves our kernel base from the cross-generation UniXNU maintainer
# kernel to the same-generation xnu-8796 tree that reaches the iOS 16 home
# screen with CPU rendering. Kernel builds need macOS with Xcode 15.4 (the
# xnu-8796 iig emits a compatible IORPC ABI; Xcode 16 does not). macos-14 is
# scheduled for full retirement on 2026-11-02, so dispatch while the image
# still exists (see ios-fuxi xnu/README.md runner-lifetime note).
#
# The upstream workflow (bangprovn/ios-fuxi .github/workflows/fuxi-build.yml,
# reviewed in verification/ios-fuxi-repository-review/20261024-01) is
# self-contained: tools/ci/build.sh pins every download in tools/ci/pins.env,
# never brew-installs, and uploads only its own outputs. We check out that
# repository at a fixed commit instead of forking, so results stay attributable
# to the pinned upstream state we reviewed. persist-credentials is disabled and
# the job token only gets read access, so the foreign build cannot touch this
# repository.

on:
  workflow_dispatch:
    inputs:
      fuxi_ref:
        description: bangprovn/ios-fuxi ref (default = reviewed commit 419b129)
        required: false
        default: 419b129ada08621003e61b50fcb1e666b65e5a25
      target:
        description: tools/ci/build.sh target
        type: choice
        options: [kernel-metal4, kernel-wlan6g]
        default: kernel-metal4

permissions:
  contents: read

jobs:
  kernel:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
    steps:
      - name: Check out pinned ios-fuxi source
        uses: actions/checkout@v4
        with:
          repository: bangprovn/ios-fuxi
          ref: ${{ inputs.fuxi_ref || '419b129ada08621003e61b50fcb1e666b65e5a25' }}
          persist-credentials: false
      - name: Record build inputs
        run: |
          git rev-parse HEAD
          sw_vers
          xcodebuild -version
      # Download caches contain public source snapshots and text patches only.
      # Never cache KDKs, SDKs or build trees (upstream review, 20261024-01).
      - uses: actions/cache@v4
        with:
          path: deps/ci-downloads
          key: fuxi-source-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target || 'kernel-metal4' }}-${{ inputs.fuxi_ref || '419b129ada08621003e61b50fcb1e666b65e5a25' }}
      - name: Build kernel target (no boot-image packing)
        run: bash tools/ci/build.sh "${{ inputs.target || 'kernel-metal4' }}"
      - name: Upload kernel outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-${{ inputs.target || 'kernel-metal4' }}-${{ strategy.job-index }}
          path: tools/out/ci/${{ inputs.target || 'kernel-metal4' }}/
          if-no-files-found: error
          retention-days: 7
